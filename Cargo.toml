[package]
name = "omatether"
version = "0.1.0"
edition = "2021"
description = "Bridge between messaging channels and the Omarchy default coding agent"
license = "MIT"
repository = "https://github.com/wadewyuan/omatether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
# The MCP channel's HTTP server. Already in the tree under reqwest, so this
# turns on the server half rather than adding a stack.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# SHA-256 and a CSPRNG for MCP API keys. Already in the tree under rustls.
ring = "0.17"
# rustls rather than the default openssl: one less system dependency for a
# service that has to start reliably at boot.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    # bytes_stream(), for the sidecar's open-ended NDJSON response.
    "stream",
    # Outbound files: a multipart body for sendPhoto/sendDocument.
    "multipart",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-std",
    "io-util",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# The paused clock, for the tests that check a timing window without waiting
# one out. A dev-dependency rather than a feature on the entry above, so the
# service that has to keep real time is never built with it.
tokio = { version = "1", features = ["test-util"] }
